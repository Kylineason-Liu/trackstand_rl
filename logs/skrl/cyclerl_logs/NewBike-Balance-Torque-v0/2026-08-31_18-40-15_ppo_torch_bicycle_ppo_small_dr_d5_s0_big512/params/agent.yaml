seed: 42
models:
  separate: true
  policy:
    class: GaussianMixin
    clip_actions: false
    clip_mean_actions: false
    network:
    - name: net
      input: observations
      layers: &id001
      - 512
      - 256
      - 128
      - 64
      activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    network:
    - name: net
      input: observations
      layers: *id001
      activations: elu
    output: ONE
memory:
  class: RandomMemory
  memory_size: -1
agent:
  class: PPO
  rollouts: 16
  mini_batches: 4
  learning_epochs: 5
  learning_rate: 0.001
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  discount_factor: 0.99
  gae_lambda: 0.95
  ratio_clip: 0.2
  value_clip: 0.2
  value_loss_scale: 1.0
  entropy_loss_scale: 0.005
  grad_norm_clip: 1.0
  kl_threshold: 0.0
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  experiment:
    directory: /home/lmbike/lmbike_cyclerl-mod/logs/skrl/cyclerl_logs/NewBike-Balance-Torque-v0
    experiment_name: 2026-08-31_18-40-15_ppo_torch_bicycle_ppo_small_dr_d5_s0_big512
    write_interval: 1000
    checkpoint_interval: 10000
trainer:
  class: SequentialTrainer
  timesteps: 240000
  environment_info: log
  close_environment_at_exit: false
  disable_progressbar: true
