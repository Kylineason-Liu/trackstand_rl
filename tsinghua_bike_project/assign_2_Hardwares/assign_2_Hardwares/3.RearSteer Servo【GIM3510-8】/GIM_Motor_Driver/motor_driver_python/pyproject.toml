[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "motor-driver"
version = "1.0.0"
description = "CAN bus motor driver library for custom CAN protocol V3.09b0"
requires-python = ">=3.8"
dependencies = [
    "python-can>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
