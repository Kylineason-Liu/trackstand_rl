trackstand_imu_publisher:
  ros__parameters:
    serial_port: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
    frame_id: "imu_link"
    publish_rate_hz: 100.0
    source_timeout_s: 0.25
    sensor_to_bike_rpy_deg: [0.0, 0.0, 0.0]
    gyro_bias_dps: [0.0, 0.0, 0.0]

trackstand_motor_io:
  ros__parameters:
    can_interface: "can0"
    steering_host_id: "102"
    steering_feedback_id: "002"
    drive_host_id: "101"
    drive_feedback_id: "001"
    steering_gear_ratio: 1.0
    drive_gear_ratio: 1.0
    # Match ros2_ws balance-assist coordinates and native motor directions.
    steering_encoder_sign: 1.0
    drive_encoder_sign: -1.0
    steering_torque_sign: 1.0
    drive_torque_sign: -1.0
    poll_rate_hz: 200.0
    control_rate_hz: 200.0
    command_timeout_s: 0.08
    feedback_timeout_s: 0.05
    steering_limit_rad: 0.5235987756
    dry_run: false

trackstand_rc_kickstand:
  ros__parameters:
    input_protocol: "crsf"
    port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0"
    auto_detect_port: true
    port_candidates:
      - "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0"
      - "/dev/serial/by-path/platform-xhci-hcd.1-usb-0:1.2:1.0-port0"
      - "/dev/ttyUSB1"
      - "/dev/serial/by-path/platform-xhci-hcd.0-usb-0:1:1.0-port0"
    exclude_port_candidates:
      - "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
      - "/dev/serial/by-path/platform-xhci-hcd.1-usb-0:1.1:1.0-port0"
      - "/dev/ttyUSB0"
    baudrate: 420000
    auto_detect_baudrate: true
    baudrate_candidates: [420000, 416666, 400000, 921600]
    baudrate_probe_sec: 2.0
    crsf_crc_mode: "soft"
    input_min: 1000
    input_center: 1500
    input_max: 2000
    auto_detect_channel_range: true
    servo_pair_switch_channel: 7
    servo_pair_high_is_up: true
    servo_pair_end_band_fraction: 0.35
    switch_debounce_frames: 8
    read_rate_hz: 100.0
    reconnect_interval_s: 1.0

trackstand_kickstand_driver:
  ros__parameters:
    serial_port: "/dev/ttyAMA2"
    baud_rate: 1000000
    servo_ids: [1, 2]
    # Raw STS3250 targets converted from ros2_ws signed angles.
    servo_up_positions: [1648, 2454]
    servo_down_positions: [1972, 2085]
    # Disable periodic serial reads during balancing; enable only for bench diagnostics.
    status_rate_hz: 0.0
    # Preserve physical support if ROS exits while the stands are down.
    disable_torque_on_shutdown: false

trackstand_policy_controller:
  ros__parameters:
    policy_rate_hz: 50.0
    imu_timeout_s: 0.06
    motor_timeout_s: 0.06
    rc_timeout_s: 0.15
    wheel_radius_m: 0.07
    max_roll_rad: 0.5235987756
    # Hardware's established 30-degree soft limit, narrower than simulation.
    max_steering_target_rad: 0.5235987756
