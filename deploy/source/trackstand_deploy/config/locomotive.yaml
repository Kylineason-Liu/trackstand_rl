# Locomotive overlay: loaded AFTER params.yaml by locomotive.launch.py.
# Hardware identities (serial by-id paths, CAN IDs, signs, servo poses, IMU mounting)
# stay single-sourced in params.yaml; only locomotive-specific keys live here.

trackstand_rc_kickstand:
  ros__parameters:
    # CH7 (params.yaml servo_pair_switch_channel) stays the enable / kickstand switch.
    # UNVERIFIED on this transmitter: AETR order (CH3 throttle, CH4 rudder/yaw).
    # Check with `ros2 topic echo /locomotive/rc_sticks` (stick up / right -> +1) before riding.
    throttle_channel: 3
    yaw_channel: 4
    throttle_reversed: false
    yaw_reversed: false

trackstand_motor_io:
  ros__parameters:
    # motor_mit_velocity_io; every other motor key (CAN IDs, signs, dry_run) comes from params.yaml.
    # Must match the model's trained rear law (manifest training_actuators.drive):
    #   mit = MIT Kp 0 / Kd below, host-bounded to 6.28 N m (Locomotive-Cylinder-Aligned-v0, default model)
    #   c1  = firmware C1 speed PI behind B3 (CycleRL originals were trained on implicit Kd 5.0; neither matches)
    rear_control_mode: "mit"
    drive_mit_kd_nm_s_per_rad: 0.2
    # F0 Vel_Max written at startup (persistent in firmware; the original is logged and restored on a
    # clean shutdown). Must cover the 45 rad/s action clip; 50 rad/s gives 0.024 rad/s resolution.
    drive_mit_velocity_max_rad_s: 50.0

locomotive_policy_controller:
  ros__parameters:
    # Locomotive-Cylinder-Aligned-v0 rank-1 recipe, 400 Hz trackstand motors, rear Kd 0.2.
    # Switching needs filename AND manifest SHA-256 (and a matching rear_control_mode above).
    model_filename: "locomotive_aligned_1900_drive03_2026-10-29_17-06-47.onnx"
    model_sha256: "ec3ccae9be48daa863eb340042a542d4c932f8e4f782b16da2c5ff8ddff91c1d"
    imu_timeout_s: 0.06
    motor_timeout_s: 0.06
    rc_timeout_s: 0.15
    # Below the 45 deg training termination; also gates start/inversion.
    max_roll_rad: 0.5236
    max_steering_start_rad: 0.0872664626
    # Training episodes start at 1.0-2.5 m/s: hand over to the policy at >= 1.0 m/s.
    wake_speed_m_s: 1.0
    # Lowest trained v* is 0.5 m/s for this model; below 0.3 m/s, fault-latch off.
    min_riding_speed_m_s: 0.3
    launch_accel_m_s2: 0.5
    command_accel_m_s2: 1.0
    # Conservative cap inside the trained 2.5 m/s maximum.
    max_speed_cmd_m_s: 1.5
    max_yaw_rate_cmd_rad_s: 0.5
    stick_deadband: 0.05
    yaw_stick_sign: -1.0
    # true = trained hub velocity action; false = CycleRL bike option (hub follows v*).
    use_policy_drive: true
